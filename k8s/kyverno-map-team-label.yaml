apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-team-label
spec:
  # Kyverno creates a native MAP + binding; the API server runs them.
  autogen:
    mutatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [ "" ]
      apiVersions: [ v1 ]
      operations: [ CREATE ]
      resources: [ configmaps ]
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >-
        Object{ metadata: Object.metadata{ labels: {"team": "platform"} } }
