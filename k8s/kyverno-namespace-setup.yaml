apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: setup-namespace
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [ "" ]
      apiVersions: [ v1 ]
      operations: [ CREATE ]
      resources: [ namespaces ]
  variables:
  - name: limitrange
    expression: >-
      {
        "apiVersion": dyn("v1"),
        "kind": dyn("LimitRange"),
        "metadata": dyn({ "name": "default-limitrange" }),
        "spec": dyn({
          "limits": [{
            "type": "Container",
            "min": { "cpu": "0.1", "memory": "0.1" },
            "max": { "cpu": "2", "memory": "2Gi" },
            "default": { "cpu": "0.25", "memory": "500Mi" },
            "defaultRequest": { "cpu": "0.25", "memory": "250Mi" }
          }]
        })
      }
  - name: resourcequota
    expression: >-
      {
        "apiVersion": dyn("v1"),
        "kind": dyn("ResourceQuota"),
        "metadata": dyn({ "name": "default-resourcequota" }),
        "spec": dyn({
          "hard": {
            "requests.cpu": "10",
            "requests.memory": "10Gi",
            "limits.cpu": "20",
            "limits.memory": "20Gi"
          }
        })
      }
  - name: networkpolicy
    expression: >-
      {
        "apiVersion": dyn("networking.k8s.io/v1"),
        "kind": dyn("NetworkPolicy"),
        "metadata": dyn({ "name": "default-networkpolicy" }),
        "spec": dyn({
          "podSelector": dyn({}),
          "ingress": [{ "from": [{ "podSelector": {} }] }]
        })
      }
  generate:
  - expression: >-
      generator.Apply(object.metadata.name,
        [ variables.limitrange, variables.resourcequota, variables.networkpolicy ])
