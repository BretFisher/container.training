apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-talon-demo
  namespace: falco-demo
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-talon-demo
  namespace: falco-demo
subjects:
  - kind: ServiceAccount
    name: falco-talon
    namespace: falco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-talon-demo
