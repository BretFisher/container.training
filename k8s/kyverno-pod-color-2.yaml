apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pod-color-policy-2
spec:
  validationActions: [ Deny ]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups: [ "" ]
      apiVersions: [ v1 ]
      operations: [ UPDATE ]
      resources: [ pods ]
  matchConditions:
  - name: had-color
    expression: "'color' in oldObject.metadata.?labels.orValue({})"
  - name: has-color
    expression: "'color' in object.metadata.?labels.orValue({})"
  validations:
  - expression: object.metadata.labels.color == oldObject.metadata.labels.color
    message: "Once label color has been added, it cannot be changed."
