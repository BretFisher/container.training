apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
spec:
  parentRefs: [ { name: eg, namespace: envoy-gateway-system } ]
  hostnames: [ canary.example.com ]
  rules:
  - backendRefs:
    - { name: blue, port: 80, weight: 90 }
    - { name: green, port: 80, weight: 10 }
