# Used in slides/k8s/podspec-hardening.md.
# The pod spec comes from https://github.com/BretFisher/podspec (pod.yaml),
# plus two fields for the "restricted" Pod Security Standard:
# capabilities drop ALL, and a read-only root filesystem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened
spec:
  selector:
    matchLabels:
      app: hardened
  template:
    metadata:
      labels:
        app: hardened
    spec:
      containers:
        - name: web
          # never use reusable tags like latest or stable
          image: ghcr.io/nginx/nginx-unprivileged:1.31.6-alpine
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            limits:
              memory: "64Mi"    # memory limit = request
            requests:
              memory: "64Mi"
              cpu: "100m"
          # per-container security context
          securityContext:
            allowPrivilegeEscalation: false # prevent sudo, setuid binaries, etc.
            privileged: false               # prevent acting like host root
            capabilities:
              drop: ["ALL"]                 # required by "restricted"
            readOnlyRootFilesystem: true    # the app writes only to /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false            # no Docker-link-style env vars
      automountServiceAccountToken: false  # no API token in the pod
      hostUsers: false                     # its own Linux user namespace
      # per-pod security context
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
