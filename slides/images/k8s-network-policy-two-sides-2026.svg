/text><text x="0" y="120.7705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The network plugin must enforce NetworkPolicy.</text></g><a href="https://kubernetes.io/docs/concepts/services-networking/network-policies/"><g transform="translate(65 836) rotate(0 231.3017578125 11.25)"><text x="0" y="16.1103515625" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#075998" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Source: Kubernetes documentation • checked 2026-10-05</text></g></a><g transform="translate(92 615) rotate(0 83.82080078125 81.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Source egress</text><text x="0" y="55.7705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Allowed</text><text x="0" y="88.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Allowed</text><text x="0" y="120.7705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Denied</text><text x="0" y="153.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Denied</text></g><g transform="translate(305 615) rotate(0 110.55712890625 81.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Destination ingress</text><text x="0" y="55.7705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Allowed</text><text x="0" y="88.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Denied</text><text x="0" y="120.7705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Allowed</text><text x="0" y="153.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Denied</text></g><g transform="translate(570 615) rotate(0 48.419921875 81.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Result</text><text x="0" y="55.7705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Connect</text><text x="0" y="88.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Block</text><text x="0" y="120.7705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Block</text><text x="0" y="153.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#0a102f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alpha