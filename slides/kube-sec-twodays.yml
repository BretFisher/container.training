# =============================================================================
# kube-sec-twodays.yml - WORK IN PROGRESS
#
# Copied from kube-twodays.yml on 2026-09-18.
# Every "REVIEW:" comment above a .md line is a proposed change
# and the reason for it. Work through them, then delete the comments.
#
# General notes:
#
# - Legend for REVIEW comments below:
#     COMMENT OUT  = active in template, not in the quote
#     COMMENT IN   = commented in template, needed by the quote
#     KEEP         = active in template, matches the quote
#     SUB-CHAPTER  = quote item is a section inside this file, no change needed
#
# - Pod Security Policies were removed in Kubernetes 1.25. The quote's
#   "PSP (legacy)" is covered by one line in the first slide of
#   pod-security-admission.md ("PSA replaces PSP"). pod-security-policies.md
#   stays out of this deck.
#
# - The "ADD EXISTING FILES" section near the bottom lists files that exist
#   in k8s/ and shared/ but are not referenced in this template. Move each
#   one up into the right content group when you work on that group.
#
# - The "NET NEW SLIDES" section at the very bottom lists quote topics with
#   no matching file. These need new markdown.
# =============================================================================

