# =============================================================================
# kube-sec-twodays.yml - WORK IN PROGRESS
#
# Copied from kube-twodays.yml on 2026-09-18. No content lines have been
# changed yet. Every "REVIEW:" comment above a .md line is a proposed change
# and the reason for it. Work through them, then delete the comments.
#
# Client quote (topic list this deck must match):
#
#   Day 1: Kubernetes Orchestration Fundamentals
#     Concepts: sample app, Kubernetes concepts, first contact with kubectl
#     Basic Usage: first containers, batch jobs, labels and annotations,
#       logs, declarative vs imperative, network model, image registries,
#       running our app on Kubernetes
#     Leveling Up: setting up Kubernetes, distros and installers, EKS on AWS,
#       daemon sets, labels and selectors
#     Working with Production Clusters: deploying with YAML, namespaces,
#       controlling a cluster remotely, accessing internal services,
#       exposing HTTP services
#     Lifecycle and Healthchecks: rolling updates, healthchecks,
#       recording deployment actions
#     Deploying on Kubernetes: Helm and Kustomize, GitOps (Flux and Argo CD),
#       cert-manager
#
#   Day 2: Platform and Workload Security
#     Auth and RBAC: authn/authz, service accounts, user certificates,
#       CSR API, OpenID Connect
#     Workload and Network Policies: network policies, restricting pod
#       permissions, PSP (legacy), Pod Security Admission, Kyverno
#     Secrets and Hardening: managing secrets, sealed secrets,
#       external secrets, securing the control plane, encrypting data at rest
#     Restricting Workload Features: resource limits, min/max/default,
#       namespace quotas, limiting in practice, node and pod resource usage
#     Security Guides and Recommendations: default pod spec, Kyverno
#       policies, GitOps and PR gating, linting, supply chain security
#
# General notes:
#
# - Legend for REVIEW comments below:
#     COMMENT OUT  = active in template, not in the quote
#     COMMENT IN   = commented in template, needed by the quote
#     KEEP         = active in template, matches the quote
#     SUB-CHAPTER  = quote item is a section inside this file, no change needed
#
# - Day 1 is heavy. The quote has 33 topics for day 1 and adds EKS, Flux,
#   Argo CD, and cert-manager (about 2,100 lines together). Plan to cut demo
#   depth in the Helm chapters (7 files today) to make room.
#
# - Day 2 replaces the storage and observability content of the template.
#   Most of the last two content groups get commented out.
#
# - Pod Security Policies were removed in Kubernetes 1.25. The PSP exercise
#   edits API server flags and will not work on EKS or a current cluster.
#   Teach it as history only.
#
# - The "ADD EXISTING FILES" section near the bottom lists files that exist
#   in k8s/ and shared/ but are not referenced in this template. Move each
#   one up into the right content group when you work on that group.
#
# - The "NET NEW SLIDES" section at the very bottom lists quote topics with
#   no matching file. These need new markdown.
# =============================================================================

