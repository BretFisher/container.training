<!DOCTYPE html>
<html>
  <head>
    <title>Training Materials</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="workshop.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <script>
      // Apply the saved theme (see the 🎨 button below) before the page
      // draws, so it doesn't flash the default colors first.
      try {
        const theme = localStorage.getItem('slides-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) { /* no storage (private window, etc.): use default */ }
    </script>
  </head>
  <body class="@@BODYCLASS@@">
    <script src="remark.min.js" type="text/javascript">
    </script>
    <div id="loading">⏳️ Loading...</div>
    <textarea id="source" style="display: none;">@@MARKDOWN@@</textarea>
    <script type="module">
      if (window.location.search[0] === '?') {
        const contentName = window.location.search.substr(1);
        let contentText = "⚠️ Failed to load content!"
        for (const url of [
          `fragments/${contentName}.md`,
          `${contentName}.md`
        ]) {
          const contentResponse = await fetch(url);
          if (contentResponse.ok) {
            contentText = await contentResponse.text();
            break;
          }
        }
        document.querySelector('#source').textContent = contentText;
      }
      /*
      This tmpl() function helps us to use the same HTML file for entire
      decks (used for live classes and pre-processed by markmaker.py to
      replace @@-strings) and to display individual chapters (used for
      video recording and not pre-processed by markmarker.py, so we still
      have @@-strings in this HTML file in that case).
      */
      function tmpl(atString, templateValue, defaultValue) {
        if (atString[0] === "@") {
          return defaultValue;
        }
        return JSON.parse(templateValue);
      }
      var tmplEXCLUDE = tmpl('@@EXCLUDE@@', '[@@EXCLUDE@@]', []);
      var tmplTITLE = tmpl('@@TITLE@@', '"@@TITLE@@"', document.title);
      var tmplSLIDENUMBERPREFIX = tmpl('@@SLIDENUMBERPREFIX@@', '"@@SLIDENUMBERPREFIX@@"', "");
      document.title = tmplTITLE;

      /*
      Slide numbers vs. steps. Remark makes one internal "slide" per step
      of an incremental slide ("--"). With countIncrementalSlides: false,
      the top-right number counts real slides, but Remark still uses step
      indexes in the URL hash and in "number + Enter". The code below makes
      the URL hash (#N) and "N + Enter" use the slide number that is shown.
      Named anchors (#toc) and presenter mode (#pN) also work.
      */
      const slideHash = /^#(p?)(\d+)$/;
      // Map step index (0-based) <-> slide number (1-based), with the same
      // rule as Remark's slide number: steps with "count: false" don't count.
      // Filled after remark.create(); empty until then.
      const stepToSlide = [];
      const slideFirstStep = [];
      const slideStepCount = [];
      // Remark writes the hash only with history.replaceState("#<step>")
      // (and "#p<step>" in presenter mode). Wrap it, so the URL shows the
      // slide number instead. Our own calls use setHash(), the original.
      const setHash = history.replaceState.bind(history);
      history.replaceState = function (state, title, url) {
        const m = typeof url === 'string' && slideHash.exec(url);
        if (m && stepToSlide.length) {
          url = '#' + m[1] + (stepToSlide[+m[2] - 1] || m[2]);
        }
        return setHash(state, title, url);
      };
      // Remark reads the hash in remark.create(), before we can map it.
      // Hold it back, and go to the matching step after create().
      const initialHash = slideHash.exec(window.location.hash);
      if (initialHash) {
        setHash(undefined, undefined, '#1');
      }
      // On a file:// page (window.origin is "null"), Remark does not use
      // replaceState: it sets location.hash = "#<step>", which fires
      // hashchange. Remember that step (see afterShowSlide below), so the
      // listener below does not read it as a slide number.
      let remarkStep = null;
      // Registered before remark.create(), so it runs before Remark's own
      // hashchange listener and changes the hash that Remark then reads.
      window.addEventListener('hashchange', function (event) {
        const m = slideHash.exec(window.location.hash);
        if (m && +m[2] === remarkStep) {
          // Remark's own hash: show the slide number, and do not let
          // Remark read it (it already shows this step).
          remarkStep = null;
          event.stopImmediatePropagation();
          setHash(undefined, undefined, '#' + m[1] + stepToSlide[+m[2] - 1]);
        } else if (m) {
          setHash(undefined, undefined, '#' + m[1] + stepForSlide(+m[2]));
          // If Remark does not move (same slide), put the number back.
          setTimeout(function () {
            if (window.location.hash === '#' + m[1] + stepForSlide(+m[2])) {
              setHash(undefined, undefined, '#' + m[1] + m[2]);
            }
          });
        }
      });

      var slideshow = remark.create({
        ratio: '16:9',
        highlightSpans: true,
        countIncrementalSlides: false,
        slideNumberFormat: `${tmplSLIDENUMBERPREFIX}%current%/%total%`,
        excludedClasses: tmplEXCLUDE
      });
      document.querySelector('#loading').style.display = 'none';

      // Fill the step <-> slide number maps (declared above).
      {
        let n = 0;
        slideshow.getSlides().forEach(function (slide, i) {
          if (slide.properties.count !== 'false') n++;
          const no = Math.max(1, n);
          stepToSlide[i] = no;
          if (slideFirstStep[no] === undefined) slideFirstStep[no] = i;
          slideStepCount[no] = (slideStepCount[no] || 0) + 1;
        });
      }
      function stepForSlide(no) {
        no = Math.min(Math.max(no, 1), slideFirstStep.length - 1);
        return slideFirstStep[no] + 1;
      }
      if (initialHash) {
        window.location.hash = '#' + initialHash[1] + initialHash[2];
      }

      // "N + Enter" goes to step N in Remark. Track the digits, and after
      // Remark has moved, go to the first step of slide N instead.
      let typedNumber = '';
      const searchDialog = document.createElement('dialog');
      const contentsDialog = document.createElement('dialog');
      const popupOpen = () => searchDialog.open || contentsDialog.open;
      document.addEventListener('keydown', function (event) {
        if (popupOpen() || event.ctrlKey || event.metaKey || event.altKey ||
            event.target.closest('input, textarea, select, [contenteditable]')) {
          typedNumber = '';
          return;
        }
        if (/^[0-9]$/.test(event.key)) {
          typedNumber += event.key;
        } else if (event.key === 'Enter' && typedNumber) {
          const no = +typedNumber;
          setTimeout(function () { slideshow.gotoSlide(stepForSlide(no)); });
          typedNumber = '';
        } else {
          typedNumber = '';
        }
      }, true);

      if (window.origin === 'null') {
        slideshow.on('afterShowSlide', function (slide) {
          remarkStep = slide.getSlideIndex() + 1;
        });
      }

      // Step counter under the slide number: "step/total" on slides with
      // more than one step. The "last" class marks the final step.
      slideshow.on('afterShowSlide', function (slide) {
        const index = slide.getSlideIndex();
        const no = stepToSlide[index];
        const total = slideStepCount[no];
        const container = document.querySelector('.remark-visible .remark-slide-content');
        if (!container) return;
        let counter = container.querySelector('.remark-step-number');
        if (total < 2) {
          if (counter) counter.remove();
          return;
        }
        if (!counter) {
          counter = document.createElement('div');
          counter.className = 'remark-step-number';
          container.appendChild(counter);
        }
        const step = index - slideFirstStep[no] + 1;
        counter.textContent = `${step}/${total}`;
        counter.classList.toggle('last', step === total);
      });

      // "?" button in the bottom-right corner of each slide. It opens the
      // same help screen as the "?" key, for people who don't know that key.
      slideshow.on('afterShowSlide', function () {
        const container = document.querySelector('.remark-visible .remark-slide-content');
        if (!container || container.querySelector('.remark-help-button')) return;
        const button = document.createElement('button');
        button.className = 'remark-help-button';
        button.textContent = '?';
        button.title = 'Keyboard shortcuts (?)';
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          slideshow.toggleHelp();
          // Drop focus, so Space/Enter go to Remark, not to this button.
          button.blur();
        });
        container.appendChild(button);
      });

      // Search the rendered student slides, before controls or Mermaid can
      // change their DOM. Remark has already removed notes and properties.
      // Keep every step's text, but return only one result per displayed number.
      const searchSlides = [];
      const normalizeSearch = text => text.replace(/\s+/g, ' ').trim().toLowerCase();
      function studentText(node) {
        if (node.nodeType === Node.TEXT_NODE) return node.textContent;
        if (node.nodeType !== Node.ELEMENT_NODE) return '';
        if (node.matches('script, style, .footer, .debug, .remark-slide-number, button, [hidden]') ||
            getComputedStyle(node).display === 'none') return '';
        const text = [...node.childNodes].map(studentText).join('');
        // Preserve spaces inside inline text; separate paragraphs and code lines.
        return text + (getComputedStyle(node).display === 'inline' ? '' : ' ');
      }
      document.querySelectorAll('.remark-slides-area .remark-slide-content').forEach((content, i) => {
        const no = stepToSlide[i];
        let entry = searchSlides.find(slide => slide.no === no);
        if (!entry) {
          entry = { no, title: '', steps: [] };
          searchSlides.push(entry);
        }
        const heading = content.querySelector('h1, h2, h3, h4, h5, h6');
        if (!entry.title && heading) entry.title = studentText(heading).trim();
        entry.steps.push({ step: i + 1, text: normalizeSearch(studentText(content)) });
      });
      searchDialog.className = 'slide-search';
      searchDialog.setAttribute('aria-labelledby', 'slide-search-title');
      searchDialog.innerHTML = `
        <div class="slide-search-header">
          <h2 id="slide-search-title">Search slides</h2>
          <button type="button" class="slide-search-close" aria-label="Close search">×</button>
        </div>
        <label for="slide-search-input">Text in this deck</label>
        <input id="slide-search-input" type="search" autocomplete="off"
          role="combobox" aria-autocomplete="list" aria-expanded="true"
          aria-controls="slide-search-results" aria-describedby="slide-search-hint">
        <p id="slide-search-hint">↑ ↓ select · Enter opens · Esc closes</p>
        <p class="slide-search-status" role="status" aria-live="polite"></p>
        <ul id="slide-search-results" role="listbox" aria-label="Matching slides"></ul>`;
      document.body.appendChild(searchDialog);
      const searchInput = searchDialog.querySelector('input');
      const searchResults = searchDialog.querySelector('ul');
      const searchStatus = searchDialog.querySelector('[role="status"]');
      let searchMatches = [];
      let selectedResult = -1;
      // Native modal dialogs keep focus inside and leave the current reveal alone.
      function popupControls(dialog) {
        let returnFocus;
        function close() {
          dialog.close();
          typedNumber = '';
          if (returnFocus && returnFocus.isConnected && returnFocus.getClientRects().length) returnFocus.focus();
          else document.body.focus();
        }
        function open() {
          if (popupOpen()) return;
          if (document.body.classList.contains('remark-help-mode')) slideshow.toggleHelp();
          returnFocus = document.activeElement;
          typedNumber = '';
          dialog.showModal();
        }
        dialog.querySelector('button').addEventListener('click', close);
        dialog.addEventListener('cancel', event => { event.preventDefault(); close(); });
        ['click', 'wheel', 'mousewheel', 'DOMMouseScroll', 'touchstart', 'touchmove', 'touchend'].forEach(type =>
          dialog.addEventListener(type, event => event.stopPropagation()));
        return { open, close };
      }
      const searchPopup = popupControls(searchDialog);
      function selectSearchResult(index) {
        selectedResult = index;
        [...searchResults.children].forEach((item, i) => {
          item.setAttribute('aria-selected', String(i === index));
        });
        const item = searchResults.children[index];
        if (item) {
          searchInput.setAttribute('aria-activedescendant', item.id);
          item.scrollIntoView({ block: 'nearest' });
        } else {
          searchInput.removeAttribute('aria-activedescendant');
        }
      }
      const closeSearch = searchPopup.close;
      function openSearch() {
        if (popupOpen()) return;
        searchPopup.open();
        updateSearch();
        searchInput.focus();
        searchInput.select();
      }
      function openSearchResult(index) {
        const result = searchMatches[index];
        if (!result) return;
        closeSearch();
        // Open the first step that includes the match, so later reveals show.
        slideshow.gotoSlide(result.step);
      }
      function updateSearch() {
        const query = normalizeSearch(searchInput.value);
        searchMatches = [];
        if (query) searchSlides.forEach(slide => {
          const match = slide.steps.find(step => step.text.includes(query));
          if (match) searchMatches.push({ ...slide, step: match.step });
        });
        searchResults.replaceChildren();
        searchStatus.textContent = !query ? 'Type text to search all slides in this deck.' :
          searchMatches.length ? `${searchMatches.length} matching slides` : 'No matching slides.';
        searchMatches.forEach((slide, i) => {
          const item = document.createElement('li');
          item.id = `slide-search-result-${i}`;
          item.setAttribute('role', 'option');
          const number = document.createElement('span');
          number.className = 'slide-search-number';
          number.textContent = tmplSLIDENUMBERPREFIX + slide.no;
          const title = document.createElement('span');
          title.textContent = slide.title || `Slide ${slide.no}`;
          item.append(number, title);
          item.addEventListener('click', () => openSearchResult(i));
          searchResults.appendChild(item);
        });
        selectSearchResult(searchMatches.length ? 0 : -1);
      }
      searchInput.addEventListener('input', updateSearch);
      contentsDialog.className = 'slide-search slide-contents';
      contentsDialog.setAttribute('aria-label', 'Table of contents');
      contentsDialog.innerHTML = `
        <button type="button" class="slide-search-close slide-contents-close" aria-label="Close contents">×</button>
        <nav aria-label="Deck chapters"></nav>`;
      const contentsNav = contentsDialog.querySelector('nav');
      // Reuse the compiler's rendered TOC, including section labels and anchors.
      slideshow.getSlides().forEach((slide, i) => {
        if (!/^toc(?:-section-\d+)?$/.test(slide.properties.name || '')) return;
        const source = document.querySelectorAll('.remark-slides-area .remark-slide-content')[i];
        const section = source.cloneNode(true);
        section.removeAttribute('id');
        const page = document.createElement('section');
        page.className = 'slide-contents-page';
        page.setAttribute('aria-label', source.querySelector('h2')?.textContent || 'Table of contents');
        const preview = document.createElement('div');
        preview.className = 'slide-contents-preview';
        const canvas = document.createElement('div');
        canvas.className = 'remark-slide slide-contents-canvas';
        // Keep Remark's original canvas size, classes, columns, and typography.
        canvas.dataset.step = i;
        section.querySelectorAll('.debug, .footer, .remark-slide-number, button').forEach(node => node.remove());
        section.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        canvas.appendChild(section);
        preview.appendChild(canvas);
        page.appendChild(preview);
        contentsNav.appendChild(page);
      });
      if (!contentsNav.children.length) contentsNav.textContent = 'This chapter view has no table of contents.';
      document.body.appendChild(contentsDialog);
      const contentsPopup = popupControls(contentsDialog);
      function fitContents() {
        if (!contentsDialog.open) return;
        const canvases = [...contentsNav.querySelectorAll('.slide-contents-canvas')];
        const bounds = canvases.map(canvas => {
          const source = document.querySelectorAll('.remark-slides-area .remark-slide-content')[+canvas.dataset.step];
          const scaler = source.closest('.remark-slide-scaler');
          canvas.style.width = scaler.style.width;
          canvas.style.height = scaler.style.height;
          canvas.style.transform = 'none';
          const origin = canvas.getBoundingClientRect();
          const children = [...canvas.firstElementChild.children].map(node => node.getBoundingClientRect())
            .filter(rect => rect.width && rect.height);
          // Trim only blank canvas edges; preserve the original text geometry.
          const left = Math.min(...children.map(rect => rect.left)) - origin.left - 4;
          const top = Math.min(...children.map(rect => rect.top)) - origin.top - 4;
          const width = Math.max(...children.map(rect => rect.right)) - origin.left - left + 4;
          const height = Math.max(...children.map(rect => rect.bottom)) - origin.top - top + 4;
          return { left, top, width, height };
        });
        const scale = Math.min(contentsNav.clientWidth / Math.max(...bounds.map(box => box.width)),
          (window.innerHeight - 34) / Math.max(...bounds.map(box => box.height)));
        canvases.forEach((canvas, i) => {
          const box = bounds[i];
          canvas.style.transform = `scale(${scale}) translate(${-box.left}px, ${-box.top}px)`;
          canvas.parentElement.style.width = box.width * scale + 'px';
          canvas.parentElement.style.height = box.height * scale + 'px';
        });
      }

      new ResizeObserver(fitContents).observe(contentsNav);
      function openContents() {
        contentsPopup.open();
        fitContents();
      }
      contentsNav.addEventListener('click', event => {
        const link = event.target.closest('a[href^="#"]');
        if (!link) return;
        event.preventDefault();
        const name = decodeURIComponent(link.getAttribute('href').slice(1));
        const index = slideshow.getSlides().findIndex(slide => slide.properties.name === name);
        contentsPopup.close();
        if (index >= 0) slideshow.gotoSlide(index + 1);
      });
      // A backdrop click belongs to the dialog, so consume it before Remark.
      window.addEventListener('click', event => {
        const dialog = searchDialog.open ? searchDialog : contentsDialog.open ? contentsDialog : null;
        if (!dialog) return;
        const rect = dialog.getBoundingClientRect();
        if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right ||
            event.clientY < rect.top || event.clientY > rect.bottom)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          (dialog === searchDialog ? searchPopup : contentsPopup).close();
        }
      }, true);
      // Capture at window level before Remark and the numeric Enter handler.
      // Native edit keys (including Cmd/Ctrl+F) keep their browser behavior.
      window.addEventListener('keydown', event => {
        if (popupOpen()) {
          event.stopImmediatePropagation();
          if (event.key === 'Escape') {
            event.preventDefault();
            (searchDialog.open ? searchPopup : contentsPopup).close();
          } else if (!event.isComposing && event.target === searchInput) {
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
              event.preventDefault();
              if (searchMatches.length) selectSearchResult(
                (selectedResult + (event.key === 'ArrowDown' ? 1 : -1) + searchMatches.length) % searchMatches.length);
            } else if (event.key === 'Enter') {
              event.preventDefault();
              openSearchResult(selectedResult);
            }
          }
        } else if ((event.key === '/' || event.key.toLowerCase() === 'o') && !event.ctrlKey && !event.metaKey && !event.altKey &&
                   !event.target.closest('input, textarea, select, [contenteditable]')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          if (event.key === '/') openSearch();
          else openContents();
        }
      }, true);
      ['keypress', 'keyup'].forEach(type => window.addEventListener(type, event => {
        if (popupOpen()) event.stopImmediatePropagation();
      }, true));
      const helpContent = document.querySelector('.remark-help-content');
      if (helpContent) {
        helpContent.querySelector('h1')?.remove();
        helpContent.setAttribute('role', 'dialog');
        helpContent.setAttribute('aria-labelledby', 'remark-help-title');
        // Same header (title and × button) as the search dialog.
        const header = document.createElement('div');
        header.className = 'slide-search-header';
        header.innerHTML = `
          <h2 id="remark-help-title">Keyboard shortcuts</h2>
          <button type="button" class="slide-search-close" aria-label="Close keyboard shortcuts">×</button>`;
        header.querySelector('button').addEventListener('click', event => {
          event.stopPropagation();
          slideshow.toggleHelp();
        });
        const hint = document.createElement('p');
        hint.className = 'remark-help-hint';
        hint.textContent = '? or Esc closes';
        // Replace Remark's "<p><b>Keyboard shortcuts</b></p>" title.
        const oldTitle = helpContent.querySelector(':scope > p');
        if (oldTitle) oldTitle.remove();
        helpContent.prepend(header, hint);
        // A click on the dimmed backdrop (outside the card) closes the help.
        helpContent.parentElement.addEventListener('click', event => {
          if (event.target === event.currentTarget) slideshow.toggleHelp();
        });
      }
      const helpTable = document.querySelector('.remark-help-content table');
      if (helpTable) {
        const row = helpTable.insertRow();
        row.insertCell().innerHTML = '<span class="key">/</span>';
        row.insertCell().textContent = 'Search all slides in this deck';
        const contentsRow = helpTable.insertRow();
        contentsRow.insertCell().innerHTML = '<span class="key">o</span>';
        contentsRow.insertCell().textContent = 'Open table of contents';
      }
      function addSearchButton() {
        const container = document.querySelector('.remark-visible .remark-slide-content');
        if (!container || container.querySelector('.remark-search-button')) return;
        const button = document.createElement('button');
        button.className = 'remark-search-button';
        button.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 6 6"></path></svg>';
        button.title = 'Search all slides (/)';
        button.setAttribute('aria-label', 'Search all slides (/)');
        button.addEventListener('click', event => {
          event.stopPropagation();
          openSearch();
        });
        container.appendChild(button);
      }
      slideshow.on('afterShowSlide', addSearchButton);
      addSearchButton();
      function addContentsButton() {
        const container = document.querySelector('.remark-visible .remark-slide-content');
        if (!container || container.querySelector('.remark-contents-button')) return;
        const button = document.createElement('button');
        button.className = 'remark-contents-button';
        button.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"></path></svg>';
        button.title = 'Table of contents (o)';
        button.setAttribute('aria-label', button.title);
        button.addEventListener('click', event => { event.stopPropagation(); openContents(); });
        container.appendChild(button);
      }
      slideshow.on('afterShowSlide', addContentsButton);
      addContentsButton();

      // 🎨 button above "?": cycle through color themes (workshop.css
      // defines the colors). Light themes first, then dark from lightest to
      // darkest. The choice is saved in this browser only.
      const themes = [
        { id: '', name: 'Default' },
        { id: 'solarized-light', name: 'Solarized Light' },
        { id: 'catppuccin-latte', name: 'Catppuccin Latte' },
        { id: 'nord', name: 'Nord' },
        { id: 'catppuccin-mocha', name: 'Catppuccin Mocha' },
        { id: 'github-dark', name: 'GitHub Dark' },
      ];
      const toast = document.createElement('div');
      toast.className = 'theme-toast';
      document.body.appendChild(toast);
      let toastTimer;
      function nextTheme() {
        const current = document.documentElement.dataset.theme || '';
        const i = themes.findIndex(t => t.id === current);
        const theme = themes[(i + 1) % themes.length];
        if (theme.id) {
          document.documentElement.dataset.theme = theme.id;
        } else {
          delete document.documentElement.dataset.theme;
        }
        try { localStorage.setItem('slides-theme', theme.id); } catch (e) {}
        // Show the theme name, then fade it out (CSS transition).
        toast.textContent = `🎨 ${theme.name}`;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), 1500);
      }
      slideshow.on('afterShowSlide', function () {
        const container = document.querySelector('.remark-visible .remark-slide-content');
        if (!container || container.querySelector('.remark-theme-button')) return;
        const button = document.createElement('button');
        button.className = 'remark-theme-button';
        button.textContent = '🎨';
        button.title = 'Change color theme';
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          nextTheme();
          // Drop focus, so Space/Enter go to Remark, not to this button.
          button.blur();
        });
        container.appendChild(button);
      });
      // Copy button on each bash/shell code block. Copies the text without
      // the slide formatting; one line per code line.
      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {
          // Fallback when the Clipboard API is blocked (e.g. plain http).
          const area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
        }
      }
      slideshow.on('afterShowSlide', function () {
        const blocks = document.querySelectorAll(
          '.remark-visible pre > code.bash, .remark-visible pre > code.shell');
        blocks.forEach(function (code) {
          const pre = code.parentElement;
          if (pre.querySelector('.copy-button')) return;
          const button = document.createElement('button');
          button.className = 'copy-button';
          button.textContent = '📋';
          button.title = 'Copy to clipboard';
          button.addEventListener('click', async function (event) {
            event.stopPropagation();
            button.blur();
            const lines = [...code.querySelectorAll('.remark-code-line')]
              .map(line => line.textContent);
            await copyText(lines.join('\n'));
            button.textContent = '✅';
            setTimeout(() => { button.textContent = '📋'; }, 1200);
          });
          pre.appendChild(button);
        });
      });
      // Body class "image-labels" (dev mode, or "imagelabels: true" in the
      // deck manifest): show the image path when the mouse is on an image.
      // One label for the page, placed over the image with fixed
      // coordinates, so the slide HTML (and the CSS rules that select slide
      // images) does not change.
      if (document.body.classList.contains('image-labels')) {
        const label = document.createElement('div');
        label.className = 'image-label';
        document.body.appendChild(label);
        document.addEventListener('mouseover', function (event) {
          const img = event.target.closest('.remark-slide-content img');
          if (!img) {
            label.classList.remove('visible');
            return;
          }
          const box = img.getBoundingClientRect();
          // The src as written in the Markdown (not the resolved URL).
          label.textContent = img.getAttribute('src');
          label.style.left = Math.max(0, box.left) + 'px';
          label.style.top = Math.max(0, box.top) + 'px';
          label.classList.add('visible');
        });
      }
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false });
        slideshow.on('afterShowSlide', function (slide) {
          mermaid.run({
            nodes: document.querySelectorAll('div.remark-visible pre.mermaid'),
          });
        });
        // Reminder, if you want to tinker with mermaid,
        // you need to export it, for instance like this:
        // window.mermaid = mermaid;
    </script>
  </body>
</html>
