<!DOCTYPE html>
<html>
  <head>
    <title>Training Materials</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="workshop.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <script>
      // Apply the saved theme (see the 🎨 button below) before the page
      // draws, so it doesn't flash the default colors first.
      try {
        const theme = localStorage.getItem('slides-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) { /* no storage (private window, etc.): use default */ }
    </script>
  </head>
  <body class="@@BODYCLASS@@">
    <script src="remark.min.js" type="text/javascript">
    </script>
    <div id="loading">⏳️ Loading...</div>
    <textarea id="source" style="display: none;">@@MARKDOWN@@</textarea>
    <script type="module">
      if (window.location.search[0] === '?') {
        const contentName = window.location.search.substr(1);
        let contentText = "⚠️ Failed to load content!"
        for (const url of [
          `fragments/${contentName}.md`,
          `${contentName}.md`
        ]) {
          const contentResponse = await fetch(url);
          if (contentResponse.ok) {
            contentText = await contentResponse.text();
            break;
          }
        }
        document.querySelector('#source').textContent = contentText;
      }
      /*
      This tmpl() function helps us to use the same HTML file for entire
      decks (used for live classes and pre-processed by markmaker.py to
      replace @@-strings) and to display individual chapters (used for
      video recording and not pre-processed by markmarker.py, so we still
      have @@-strings in this HTML file in that case).
      */
      function tmpl(atString, templateValue, defaultValue) {
        if (atString[0] === "@") {
          return defaultValue;
        }
        return JSON.parse(templateValue);
      }
      var tmplEXCLUDE = tmpl('@@EXCLUDE@@', '[@@EXCLUDE@@]', []);
      var tmplTITLE = tmpl('@@TITLE@@', '"@@TITLE@@"', document.title);
      var tmplSLIDENUMBERPREFIX = tmpl('@@SLIDENUMBERPREFIX@@', '"@@SLIDENUMBERPREFIX@@"', "");
      document.title = tmplTITLE;

      /*
      Slide numbers vs. steps. Remark makes one internal "slide" per step
      of an incremental slide ("--"). With countIncrementalSlides: false,
      the top-right number counts real slides, but Remark still uses step
      indexes in the URL hash and in "number + Enter". The code below makes
      the URL hash (#N) and "N + Enter" use the slide number that is shown.
      Named anchors (#toc) and presenter mode (#pN) also work.
      */
      const slideHash = /^#(p?)(\d+)$/;
      // Map step index (0-based) <-> slide number (1-based), with the same
      // rule as Remark's slide number: steps with "count: false" don't count.
      // Filled after remark.create(); empty until then.
      const stepToSlide = [];
      const slideFirstStep = [];
      const slideStepCount = [];
      // Remark writes the hash only with history.replaceState("#<step>")
      // (and "#p<step>" in presenter mode). Wrap it, so the URL shows the
      // slide number instead. Our own calls use setHash(), the original.
      const setHash = history.replaceState.bind(history);
      history.replaceState = function (state, title, url) {
        const m = typeof url === 'string' && slideHash.exec(url);
        if (m && stepToSlide.length) {
          url = '#' + m[1] + (stepToSlide[+m[2] - 1] || m[2]);
        }
        return setHash(state, title, url);
      };
      // Remark reads the hash in remark.create(), before we can map it.
      // Hold it back, and go to the matching step after create().
      const initialHash = slideHash.exec(window.location.hash);
      if (initialHash) {
        setHash(undefined, undefined, '#1');
      }
      // Registered before remark.create(), so it runs before Remark's own
      // hashchange listener and changes the hash that Remark then reads.
      window.addEventListener('hashchange', function () {
        const m = slideHash.exec(window.location.hash);
        if (m) {
          setHash(undefined, undefined, '#' + m[1] + stepForSlide(+m[2]));
          // If Remark does not move (same slide), put the number back.
          setTimeout(function () {
            if (window.location.hash === '#' + m[1] + stepForSlide(+m[2])) {
              setHash(undefined, undefined, '#' + m[1] + m[2]);
            }
          });
        }
      });

      var slideshow = remark.create({
        ratio: '16:9',
        highlightSpans: true,
        countIncrementalSlides: false,
        slideNumberFormat: `${tmplSLIDENUMBERPREFIX}%current%/%total%`,
        excludedClasses: tmplEXCLUDE
      });
      document.querySelector('#loading').style.display = 'none';

      // Fill the step <-> slide number maps (declared above).
      {
        let n = 0;
        slideshow.getSlides().forEach(function (slide, i) {
          if (slide.properties.count !== 'false') n++;
          const no = Math.max(1, n);
          stepToSlide[i] = no;
          if (slideFirstStep[no] === undefined) slideFirstStep[no] = i;
          slideStepCount[no] = (slideStepCount[no] || 0) + 1;
        });
      }
      function stepForSlide(no) {
        no = Math.min(Math.max(no, 1), slideFirstStep.length - 1);
        return slideFirstStep[no] + 1;
      }
      if (initialHash) {
        window.location.hash = '#' + initialHash[1] + initialHash[2];
      }

      // "N + Enter" goes to step N in Remark. Track the digits, and after
      // Remark has moved, go to the first step of slide N instead.
      let typedNumber = '';
      document.addEventListener('keydown', function (event) {
        if (/^[0-9]$/.test(event.key)) {
          typedNumber += event.key;
        } else if (event.key === 'Enter' && typedNumber) {
          const no = +typedNumber;
          setTimeout(function () { slideshow.gotoSlide(stepForSlide(no)); });
          typedNumber = '';
        } else {
          typedNumber = '';
        }
      }, true);

      // Step counter under the slide number: "step/total" on slides with
      // more than one step. The "last" class marks the final step.
      slideshow.on('afterShowSlide', function (slide) {
        const index = slide.getSlideIndex();
        const no = stepToSlide[index];
        const total = slideStepCount[no];
        const container = document.querySelector('.remark-visible .remark-slide-content');
        if (!container) return;
        let counter = container.querySelector('.remark-step-number');
        if (total < 2) {
          if (counter) counter.remove();
          return;
        }
        if (!counter) {
          counter = document.createElement('div');
          counter.className = 'remark-step-number';
          container.appendChild(counter);
        }
        const step = index - slideFirstStep[no] + 1;
        counter.textContent = `${step}/${total}`;
        counter.classList.toggle('last', step === total);
      });

      // "?" button in the bottom-right corner of each slide. It opens the
      // same help screen as the "?" key, for people who don't know that key.
      slideshow.on('afterShowSlide', function () {
        const container = document.querySelector('.remark-visible .remark-slide-content');
        if (!container || container.querySelector('.remark-help-button')) return;
        const button = document.createElement('button');
        button.className = 'remark-help-button';
        button.textContent = '?';
        button.title = 'Keyboard shortcuts (?)';
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          slideshow.toggleHelp();
          // Drop focus, so Space/Enter go to Remark, not to this button.
          button.blur();
        });
        container.appendChild(button);
      });

      // 🎨 button left of "?": cycle through color themes (workshop.css
      // defines the colors). Light themes first, then dark from lightest to
      // darkest. The choice is saved in this browser only.
      const themes = [
        { id: '', name: 'Default' },
        { id: 'solarized-light', name: 'Solarized Light' },
        { id: 'catppuccin-latte', name: 'Catppuccin Latte' },
        { id: 'nord', name: 'Nord' },
        { id: 'catppuccin-mocha', name: 'Catppuccin Mocha' },
        { id: 'github-dark', name: 'GitHub Dark' },
      ];
      const toast = document.createElement('div');
      toast.className = 'theme-toast';
      document.body.appendChild(toast);
      let toastTimer;
      function nextTheme() {
        const current = document.documentElement.dataset.theme || '';
        const i = themes.findIndex(t => t.id === current);
        const theme = themes[(i + 1) % themes.length];
        if (theme.id) {
          document.documentElement.dataset.theme = theme.id;
        } else {
          delete document.documentElement.dataset.theme;
        }
        try { localStorage.setItem('slides-theme', theme.id); } catch (e) {}
        // Show the theme name, then fade it out (CSS transition).
        toast.textContent = `🎨 ${theme.name}`;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), 1500);
      }
      slideshow.on('afterShowSlide', function () {
        const container = document.querySelector('.remark-visible .remark-slide-content');
        if (!container || container.querySelector('.remark-theme-button')) return;
        const button = document.createElement('button');
        button.className = 'remark-theme-button';
        button.textContent = '🎨';
        button.title = 'Change color theme';
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          nextTheme();
          // Drop focus, so Space/Enter go to Remark, not to this button.
          button.blur();
        });
        container.appendChild(button);
      });
      // Copy button on each bash/shell code block. Copies the text without
      // the slide formatting; one line per code line.
      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {
          // Fallback when the Clipboard API is blocked (e.g. plain http).
          const area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
        }
      }
      slideshow.on('afterShowSlide', function () {
        const blocks = document.querySelectorAll(
          '.remark-visible pre > code.bash, .remark-visible pre > code.shell');
        blocks.forEach(function (code) {
          const pre = code.parentElement;
          if (pre.querySelector('.copy-button')) return;
          const button = document.createElement('button');
          button.className = 'copy-button';
          button.textContent = '📋';
          button.title = 'Copy to clipboard';
          button.addEventListener('click', async function (event) {
            event.stopPropagation();
            button.blur();
            const lines = [...code.querySelectorAll('.remark-code-line')]
              .map(line => line.textContent);
            await copyText(lines.join('\n'));
            button.textContent = '✅';
            setTimeout(() => { button.textContent = '📋'; }, 1200);
          });
          pre.appendChild(button);
        });
      });
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false });
        slideshow.on('afterShowSlide', function (slide) {
          mermaid.run({
            nodes: document.querySelectorAll('div.remark-visible pre.mermaid'),
          });
        });
        // Reminder, if you want to tinker with mermaid,
        // you need to export it, for instance like this:
        // window.mermaid = mermaid;
    </script>

    <!-- 
    These two scripts will be available only when loading the
    content using the pub/sub server. Otherwise, they'll just
    404 and that's OK.
    -->
    <script src="/socket.io/socket.io.js">
    </script>
    <script src="/remote.js">
    </script>

  </body>
</html>
