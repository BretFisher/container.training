# Local slide development. Start: make serve [SLIDES_DECK=filename.yml].
# Compose watch runs in the foreground. Stop with Ctrl+C, then make down.
#
# One container. No bind mounts, no volumes. The image carries a baseline
# copy of slides/ and k8s/, builds the selected deck (or all decks), and serves the
# result with Python's HTTP server. Compose watch syncs each source edit into
# the container (faster than a macOS bind mount) and re-runs ./build.sh once.
# Generated files never touch the host.
#
# Always build before startup so the baseline matches your checkout; sync only
# carries changes made while the watcher is running.
services:
  slides:
    build:
      context: ..
      dockerfile: slides/Dockerfile
    ports:
      - "${SLIDES_PORT:-8080}:80"
    # markmaker.py normally asks git for these. There is no .git in the
    # container, so the Makefile passes them in from the host.
    environment:
      # Show each slide's source file and "name:" anchor in its footer.
      # Netlify does not set this, so production slides do not change.
      SLIDES_DEV: ${SLIDES_DEV:-1}
      # Empty selects all decks; retained for startup and every watch exec.
      SLIDES_DECK: ${SLIDES_DECK:-}
      REPOSITORY_URL: ${REPOSITORY_URL:-}
      BRANCH: ${BRANCH:-}
      COMMIT: ${COMMIT:-}
    develop:
      watch:
        # Slide sources: manifests, markdown, images, CSS, JS, templates.
        - path: .
          target: /repo/slides
          action: sync+exec
          exec:
            command: ./build.sh once
          ignore:
            - "*.yml.html"
            - "*.tmp"
            - index.html
            - past.html
            - slides.zip
            - fragments/
            - labtest/
            - .env
            - Makefile
        # Manifests pulled into slides with @@INCLUDE[k8s/...].
        - path: ../k8s
          target: /repo/k8s
          action: sync+exec
          exec:
            command: ./build.sh once
