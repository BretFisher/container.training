[build]
  base = "slides/"
  # Paths are relative to "base"; an empty publish path deploys slides/ itself.
  publish = ""
  command = "./build.sh once"

[build.environment]
  # Python used by the build. Matches PYTHON_VERSION in slides/Dockerfile.
  # Netlify resolves "3.14" to the latest 3.14.x release.
  PYTHON_VERSION = "3.14"
  # Also create slides.zip (not needed for local dev, see slides/build.sh).
  SLIDES_ZIP = "1"
