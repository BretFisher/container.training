---
# template source: https://github.com/bretfisher/docker-build-workflow/blob/main/templates/call-docker-build.yaml
name: DockerCoins hasher

on:
  push:
    # any branch can match here; the job below only runs on the default branch,
    # because on.push.branches cannot read the default branch name
    # only rebuild this image when its own code (or this workflow) changes
    paths:
      - "dockercoins/hasher/**"
      - ".github/workflows/dockercoins-hasher.yaml"

# cancel any previously-started, yet still active runs of this workflow on the same branch
# (a newer commit replaces the same v0.1 tag, so an older run has no value)
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# reset permsissions to none at the workflow level
# we'll set them at the job level below
permissions: {}

jobs:
  call-docker-build:
    name: Call Docker Build

    # trusted ref only: publish from the default branch, whatever its name is today
    if: github.ref_name == github.event.repository.default_branch

    uses: bretfisher/docker-build-workflow/.github/workflows/reusable-docker-build-native.yaml@main

    # set permissions here to be equal or greater than what's required in the Reusable Workflow
    # Permissions set here for the GITHUB_TOKEN are then passed to the Reusable Workflow
    # Calling permissions must be equal to or greater than these reusable permissions for it to work
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows#supported-keywords-for-jobs-that-call-a-reusable-workflow
    permissions:
      contents: read
      packages: write # needed to push docker image to ghcr.io
      pull-requests: write # needed to create and update comments in PRs

    with:

      # NOTE: there are lots of input options for this reusable workflow
      # read the comments in the inputs area of the reusable workflow for more info
      # https://github.com/BretFisher/docker-build-workflow/blob/main/.github/workflows/reusable-docker-build-native.yaml

      dockerhub-enable: false
      ghcr-enable: true

      image-names: |
        ghcr.io/bretfisher/dockercoins/hasher

      # DockerCoins is a teaching demo: the slides always use the same version tag
      flavor-rules: |
        latest=false
      tag-rules: |
        type=raw,value=v0.1

      context: "{{defaultContext}}:dockercoins/hasher"

      # platforms are *native GitHub Runners by default, so only amd64 and/or arm64 are supported, and must be in JSON syntax.
      platforms: '["linux/amd64", "linux/arm64"]'

      comment-enable: false
